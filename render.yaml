services:
  - type: web
    name: cinerate-web
    runtime: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    preDeployCommand: php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: cinerate-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cinerate-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: cinerate-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: cinerate-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cinerate-db
          property: password
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_BASE_URL
        value: https://api.themoviedb.org/3

databases:
  - name: cinerate-db
    plan: free
    databaseName: cinerate
    user: cinerate
