[phases.setup]
nixPkgs = ['nodejs_20', 'npm']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader', 'npm install --no-audit --no-fund']

[phases.build]
cmds = ['npm run build', 'php artisan view:cache']

[start]
cmd = 'php artisan migrate --force 2>&1 || true && php artisan serve --host=0.0.0.0 --port=${PORT:-3000}'
